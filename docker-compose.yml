# Flood Monitoring and Risk (Team 2) - local Airflow stack
#   cp .env.example .env   (Windows: copy .env.example .env) and fill it in
#   docker compose up -d --build   ->  Airflow UI at http://localhost:8080
x-airflow-common: &airflow-common
  build: .
  image: flood-monitor-airflow:2.10.2
  env_file: .env
  environment: &airflow-common-env
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-change-me-in-env}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    PYTHONPATH: /opt/airflow/src
    AIRFLOW_CONN_FS_DEFAULT: '{"conn_type": "fs", "extra": {"path": "/opt/airflow"}}'
    # Workshop 3: PySpark in local mode inside the scheduler (LocalExecutor runs the tasks there)
    SPARK_MASTER: local[*]
    SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-1g}
    SPARK_SHUFFLE_PARTITIONS: "8"
    SPARK_LOCAL_DIR: /tmp/spark-local
    GOLD_KEEP_RUNS: "48"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./config:/opt/airflow/config
    - ./data:/opt/airflow/data
    - ./airflow/logs:/opt/airflow/logs
    - ./datalake_bronze:/opt/airflow/datalake_bronze
    - ./datalake_silver:/opt/airflow/datalake_silver
    - ./datalake_gold:/opt/airflow/datalake_gold
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/datalake_bronze /opt/airflow/datalake_silver /opt/airflow/datalake_gold
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname Team2 \
          --lastname FloodMonitor \
          --role Admin \
          --email team2@udistrital.edu.co \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" || true

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    restart: always

volumes:
  postgres-db-volume: